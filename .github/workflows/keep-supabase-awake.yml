# Supabase pauses a free project after a week without requests, and the shared top ten goes with it.
# Once a day this reads one row from rally_times, the way the game does, so the project stays awake.
# The URL and key are the public ones in src/game/leaderboard.ts: the publishable key, which may only
# read and insert. Repository variables SUPABASE_URL and SUPABASE_KEY override them if set.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from rally_times
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://eyiycddbwzoduzscibwg.supabase.co' }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_nWfrq9HCgmA0dbgFqmzBBQ_8JPTTUSI' }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/rally_times?select=time_ms&limit=1"
          echo
